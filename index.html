<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>YouTube Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #0f0f0f;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .container {
      width: min(1200px, 94vw);
      margin: 0 auto;
      padding: 32px 0 50px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
      font-weight: 600;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .info {
      margin-top: 20px;
      padding: 16px 18px;
      background: #181818;
      border-radius: 10px;
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    .video-id {
      color: #fff;
      font-family: monospace;
    }

    @media (max-width: 600px) {
      .container {
        width: 100%;
        padding: 20px 12px;
      }

      h1 {
        font-size: 22px;
      }

      .player {
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>YouTube Viewer</h1>

    <div class="player">
      <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video player"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <div class="info">
      Video ID:
      <span class="video-id">dQw4w9WgXcQ</span>
    </div>

  </main>

</body>
</html>
